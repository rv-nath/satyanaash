[package]
name = "satyanaash-api"
version = "0.1.0"
edition = "2021"
description = "REST API backend for Satyanaash - Graph-based HTTP API Testing Framework"

[dependencies]
# Web Framework - Axum 0.8.4 (latest as of Nov 2025)
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Async Runtime - Tokio 1.48.0 (latest)
tokio = { version = "1.48", features = ["full"] }

# Database - SQLx 0.8 with abstraction layer (Any driver for SQLite/PostgreSQL swap)
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "postgres", "uuid", "chrono", "json"] }

# Async trait for repository pattern
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP Client (for test execution)
reqwest = { version = "0.12", features = ["json"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Execution Engine
rhai = { version = "1.23", features = ["sync"] }  # Rust-native scripting for assertions
jsonpath-rust = "1.0"                              # JSONPath for variable extraction
regex = "1"                                        # Variable interpolation

# SSE Streaming
async-stream = "0.3"                               # For SSE stream generation
futures = "0.3"                                    # Stream utilities

# Random Data Generation
bharat-cafe = "0.2"                                # Indian names, addresses, phones, etc.
